; PlantCare firmware.
;   pio run -e esp32dev            build for the ESP32 DevKit (WROOM-32)
;   pio run -e esp32dev -t upload  flash over USB
;   pio test -e native             run the core-logic unit tests on this PC

[platformio]
default_envs = esp32dev

[common]
version = 0.1.0

[env:esp32dev]
platform = platformio/espressif32 @ 7.1.3
board = esp32dev
framework = arduino
board_build.partitions = partitions.csv
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
upload_speed = 921600
build_flags =
  -DCORE_DEBUG_LEVEL=2
  -DPLANTCARE_VERSION=\"${common.version}\"
build_src_flags =
  -Wall
  -Wextra
  -Wno-unused-parameter
lib_deps =
  esp32async/AsyncTCP @ 3.5.0
  esp32async/ESPAsyncWebServer @ 3.12.1
  bblanchon/ArduinoJson @ 7.4.3
  adafruit/Adafruit ADS1X15 @ 2.6.2
  adafruit/Adafruit SHT4x Library @ 1.0.5
  claws/BH1750 @ 1.3.0
  adafruit/RTClib @ 2.1.4
  bogde/HX711 @ 0.7.5

[env:native]
platform = native
test_framework = unity
build_src_filter = -<*>
build_flags =
  -std=c++17
  -Wall
  -Wextra
  -DPLANTCARE_VERSION=\"${common.version}\"
  -DFIXTURES_DIR=\"$PROJECT_DIR/../shared/api-fixtures\"
lib_deps =
  bblanchon/ArduinoJson @ 7.4.3
