; PlantCare firmware: one main station, one node per plant.
;   pio run -e hub                         main station (ESP32 DevKit, serves the dashboard)
;   pio run -e node_supermini_c3           plant node on an ESP32-C3 SuperMini
;   pio run -e node_xiao_c3                ...on a Seeed XIAO ESP32-C3
;   pio run -e node_xiao_s3                ...on a Seeed XIAO ESP32-S3
;   pio run -e <env> -t upload             flash over USB
;   pio test -e native                     run the core-logic unit tests on this PC

[platformio]
default_envs = hub

[common]
version = 0.2.0

[esp32]
platform = platformio/espressif32 @ 7.1.3
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
build_unflags = -std=gnu++11
build_src_flags =
  -Wall
  -Wextra
  -Wno-unused-parameter

[env:hub]
extends = esp32
board = esp32dev
board_build.partitions = partitions.csv
upload_speed = 921600
build_src_filter = +<hub/>
build_flags =
  -std=gnu++17
  -DCORE_DEBUG_LEVEL=2
  -DPLANTCARE_VERSION=\"${common.version}\"
  ; Web server on core 0 at a modest priority; the radio task outranks it, so a
  ; slow history query never makes a node wait for its reply.
  -DCONFIG_ASYNC_TCP_RUNNING_CORE=0
  -DCONFIG_ASYNC_TCP_PRIORITY=3
  -DCONFIG_ASYNC_TCP_USE_WDT=0
lib_deps =
  esp32async/AsyncTCP @ 3.5.0
  esp32async/ESPAsyncWebServer @ 3.12.1
  bblanchon/ArduinoJson @ 7.4.3

[node]
extends = esp32
build_src_filter = +<node/>
build_flags =
  -std=gnu++17
  -DCORE_DEBUG_LEVEL=1
  -DPLANTCARE_VERSION=\"${common.version}\"
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
  bblanchon/ArduinoJson @ 7.4.3

[env:node_supermini_c3]
extends = node
board = esp32-c3-devkitm-1
build_flags = ${node.build_flags} -DBOARD_SUPERMINI_C3

[env:node_xiao_c3]
extends = node
board = seeed_xiao_esp32c3
build_flags = ${node.build_flags} -DBOARD_XIAO_C3

[env:node_xiao_s3]
extends = node
board = seeed_xiao_esp32s3
build_flags = ${node.build_flags} -DBOARD_XIAO_S3

[env:native]
platform = native
test_framework = unity
build_src_filter = -<*>
build_flags =
  -std=c++17
  -Wall
  -Wextra
  -DPLANTCARE_VERSION=\"${common.version}\"
  -DFIXTURES_DIR=\"$PROJECT_DIR/../shared/api-fixtures\"
lib_deps =
  bblanchon/ArduinoJson @ 7.4.3
