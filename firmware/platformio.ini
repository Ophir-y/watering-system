; PlantCare firmware.
;   pio run -e esp32dev            build for the ESP32 DevKit (WROOM-32)
;   pio run -e esp32dev -t upload  flash over USB
;   pio test -e native             run the core-logic unit tests on this PC

[platformio]
default_envs = esp32dev

[common]
version = 0.1.0

[env:esp32dev]
platform = platformio/espressif32 @ 7.1.3
board = esp32dev
framework = arduino
board_build.partitions = partitions.csv
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
upload_speed = 921600
build_unflags = -std=gnu++11
build_flags =
  -std=gnu++17
  -DCORE_DEBUG_LEVEL=2
  -DPLANTCARE_VERSION=\"${common.version}\"
  ; Web server on core 0, below the control (5) and safety (6) tasks on core 1, so a
  ; slow history query can never delay dosing. Queries are bounded instead of watchdogged.
  -DCONFIG_ASYNC_TCP_RUNNING_CORE=0
  -DCONFIG_ASYNC_TCP_PRIORITY=3
  -DCONFIG_ASYNC_TCP_USE_WDT=0
build_src_flags =
  -Wall
  -Wextra
  -Wno-unused-parameter
lib_deps =
  esp32async/AsyncTCP @ 3.5.0
  esp32async/ESPAsyncWebServer @ 3.12.1
  bblanchon/ArduinoJson @ 7.4.3
  bogde/HX711 @ 0.7.5

[env:native]
platform = native
test_framework = unity
build_src_filter = -<*>
build_flags =
  -std=c++17
  -Wall
  -Wextra
  -DPLANTCARE_VERSION=\"${common.version}\"
  -DFIXTURES_DIR=\"$PROJECT_DIR/../shared/api-fixtures\"
lib_deps =
  bblanchon/ArduinoJson @ 7.4.3
