; Bench spike for the plant node (phase 1). A throwaway sketch, separate from the
; real firmware: it answers the open hardware questions before the node is built.
;
;   cd firmware/tools/spike
;   pio run -e supermini_c3 -t upload -t monitor     (or xiao_c3 / xiao_s3)
;   pio run -e receiver -t upload -t monitor         (ESP32 DevKit, for the range test)
;
; See README.md in this folder for what to measure and how to read the results.

[env]
platform = platformio/espressif32 @ 7.1.3
framework = arduino
monitor_speed = 115200

[env:supermini_c3]
board = esp32-c3-devkitm-1
build_flags = -DBOARD_SUPERMINI_C3 -DARDUINO_USB_MODE=1 -DARDUINO_USB_CDC_ON_BOOT=1

[env:xiao_c3]
board = seeed_xiao_esp32c3
build_flags = -DBOARD_XIAO_C3 -DARDUINO_USB_MODE=1 -DARDUINO_USB_CDC_ON_BOOT=1

[env:xiao_s3]
board = seeed_xiao_esp32s3
build_flags = -DBOARD_XIAO_S3 -DARDUINO_USB_MODE=1 -DARDUINO_USB_CDC_ON_BOOT=1

[env:receiver]
board = esp32dev
build_flags = -DSPIKE_RECEIVER
